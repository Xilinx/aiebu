name: Check File Encoding

on:
  pull_request:

jobs:
  binary_check:
    runs-on: ubuntu-latest
    steps:

    - name: Install Dependencies
      run: |
        sudo apt update
        sudo apt install jq curl
    - name: Binary Check
      run: |
        URL="https://api.github.com/repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files"
        RESPONSE=$(curl -s -X GET -G $URL)

        echo "$RESPONSE" | jq -r '.[] | "\(.status) \(.filename) \(.raw_url)"' | while read status filename raw_url; do
          echo "checking $filename (status: $status) ..."

          # Skip null files (git submodule references)
          if [ "$raw_url" == "null" ]; then
            echo "  skipping submodule file"
            continue
          fi

          # Skip deleted files - they already existed in the repository
          if [ "$status" == "removed" ]; then
            echo "  skipping deleted file (already exists in repository)"
            continue
          fi

          # Check if file is a text file
          if ! $(curl -s -L -I "$raw_url" | grep "content-type:" | tail -1 | grep -qiE 'text/|image/svg[+]xml'); then
            echo "$filename is not a text file"
            exit 1
          fi
        done
